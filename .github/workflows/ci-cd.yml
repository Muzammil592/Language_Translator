name: MERN Translator CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Paths ko aapki actual directory ke mutabiq strict match kiya hai:
      - name: Create Dummy Environment Files
        run: |
          echo "RAPID_API_KEY=mock_key" > Backend/.env
          echo "VITE_API_URL=http://localhost:5000" > Frontend/my-react-app/.env

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Yahan humne file ka naam exact capital 'D' ke sath specify kar diya hai:
      - name: Test Docker Compose Build
        run: |
          docker compose -f Docker-compose.yml build

      - name: Pipeline Status
        run: echo "CI Build Phase Successful! Images are clean and compilable."