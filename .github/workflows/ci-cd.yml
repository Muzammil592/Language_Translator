name: MERN Translator CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Dummy Environment Files
        run: |
          echo "RAPID_API_KEY=mock_key" > Backend/.env
          echo "VITE_API_URL=http://localhost:5000" > Frontend/my-react-app/.env

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images
        run: |
          docker compose -f Docker-compose.yml build

      - name: Run Docker Containers
        run: |
          docker compose -f Docker-compose.yml up -d

      - name: Verify Running Containers & Health
        run: |
          echo "=== 5 Seconds Wait Kar Rahein Hain Taake Servers Active Ho Jayein ==="
          sleep 5
          
          echo "=== Container Running Status ==="
          docker ps
          
          echo "=== Backend Core API Health Test ==="
          # Yahan par naye status check rule ko merge kar diya hai:
          curl -I http://localhost:5000 || true

      - name: Stop Containers
        run: |
          docker compose -f Docker-compose.yml down